<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Corporate Banking</title><style>body{margin:0;background:#0d1728;color:#f3f6fa;font:16px system-ui}header{background:#142942;padding:64px 8%}h1{font-size:clamp(32px,5vw,60px);margin:8px 0}main{padding:38px 8%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.card{background:#192b43;border:1px solid #35506d;border-radius:15px;padding:24px;color:inherit;text-decoration:none}.card:hover{border-color:#92bdf3}.tag{color:#9fc6ff;font-size:13px}p{color:#c3d0e0;line-height:1.65}article{max-width:820px}button{padding:12px;background:#29476b;color:white;border:0;border-radius:8px}footer{padding:30px 8%;color:#9aafc7}</style><header><div class="tag">BIBLIOTECA DE ESTUDOS</div><h1>Radar Corporate Banking</h1><p>Crédito corporativo · Risco · Valuation · Governança · Estratégia</p></header><main id="root"></main><footer>Conteúdo para desenvolvimento profissional. Verifique fontes e dados antes de utilizá-los em decisões financeiras.</footer><script>const editions=[{n:14,t:'Governança, sucessão e alocação de capital',s:'O risco de crédito que não aparece no balanço.',a:['Avaliar a influência de acionistas, sucessão e distribuição de dividendos sobre a liquidez.','Analisar operações entre partes relacionadas e a governança das decisões de investimento.','Exercício: estimar CFADS e DSCR antes e depois de distribuições extraordinárias.']},{n:13,t:'Empresas zumbis e evergreening',s:'Diferenciar problemas de liquidez e de solvência.',a:['Testar capacidade de serviço da dívida sem refinanciamento automático.']},{n:12,t:'Opcionalidade de funding',s:'Bancos, não bancos e alternativas de financiamento.',a:['Mapear concentração de funding, custo efetivo e risco de rolagem.']},{n:11,t:'Financiamento de empresas asset-light',s:'Receitas recorrentes, intangíveis e garantias.',a:['Analisar retenção de clientes, margem e geração de caixa.']},{n:10,t:'IFRS 18 e qualidade dos resultados',s:'Comparabilidade das demonstrações e métricas.',a:['Confrontar EBITDA ajustado, lucro operacional e caixa.']},{n:9,t:'IA no relationship lending',s:'Tecnologia e informação privada no crédito.',a:['Combinar alertas automatizados com visitas e julgamento humano.']},{n:8,t:'CAPEX e ativos intangíveis',s:'Investimento, retorno e estrutura de capital.',a:['Avaliar prazo de maturação, retorno e fontes de financiamento.']}];function draw(){let id=Number(location.hash.replace('#edicao-',''));let e=editions.find(x=>x.n===id);document.getElementById('root').innerHTML=e?'<button onclick="location.hash=\'\'">← Voltar</button><article><p class="tag">EDIÇÃO '+e.n+'</p><h2>'+e.t+'</h2><p>'+e.s+'</p><h3>Aplicações práticas</h3><ul>'+e.a.map(x=>'<li><p>'+x+'</p></li>').join('')+'</ul><p>Resumo inicial. A análise integral e as referências oficiais serão incorporadas posteriormente.</p></article>':'<h2>Edições semanais</h2><div class="grid">'+editions.map(x=>'<a class="card" href="#edicao-'+x.n+'"><div class="tag">EDIÇÃO '+x.n+'</div><h2>'+x.t+'</h2><p>'+x.s+'</p><span class="tag">Abrir edição →</span></a>').join('')+'</div>'}addEventListener('hashchange',draw);draw();</script></html>
