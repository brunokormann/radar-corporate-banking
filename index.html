<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Corporate Banking</title><style>:root{font-family:Inter,system-ui,Arial;background:#0b1220;color:#edf3ff}*{box-sizing:border-box}body{margin:0}header{padding:35px max(24px,calc((100vw - 1180px)/2));background:linear-gradient(120deg,#132849,#0b1220);border-bottom:1px solid #293c56}h1{font-size:clamp(28px,4vw,46px);margin:5px 0}p{line-height:1.7;color:#b9c9dc}.eyebrow{color:#7dc8ff;font-weight:700;letter-spacing:2px;font-size:12px}main{max-width:1180px;margin:auto;padding:28px 22px}input,select{background:#152238;border:1px solid #38506d;color:white;padding:14px;border-radius:10px;font-size:15px}input{width:min(100%,450px)}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.card{background:#142238;border:1px solid #30435e;border-radius:16px;padding:23px;cursor:pointer;text-align:left;color:inherit;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#5daef2;background:#1b2c46}.date{font-size:12px;color:#88a6c8}.tag{display:inline-block;background:#243f5e;color:#9dd6ff;border-radius:30px;padding:5px 10px;font-size:12px;margin:8px 0}.card h2{font-size:21px;line-height:1.3}.card p{font-size:14px}.read{color:#7dc8ff;font-weight:700}article{max-width:850px;margin:auto;background:#111e31;padding:clamp(20px,5vw,50px);border:1px solid #30435e;border-radius:16px}article h2{margin-top:32px}article li{margin-bottom:10px;line-height:1.6}a{color:#80caff}button.back{background:none;border:0;color:#8bd0ff;font-size:15px;cursor:pointer;margin-bottom:22px}footer{text-align:center;padding:35px;color:#91a7c1;font-size:13px}.hidden{display:none}.notice{border-left:3px solid #6bbdff;padding:10px 16px;background:#152a42;margin:25px 0}</style></head><body><header><div class="eyebrow">INTELIGÊNCIA • CRÉDITO • ESTRATÉGIA</div><h1>Radar Corporate Banking</h1><p>Biblioteca de leituras e análises aplicadas ao Corporate Banking brasileiro.</p></header><main><section id="home"><div class="tools"><input id="search" placeholder="Pesquisar tema, leitura ou palavra-chave..." aria-label="Pesquisar"><select id="filter" aria-label="Filtrar categoria"><option value="">Todos os temas</option><option>Crédito</option><option>Governança</option><option>IA</option><option>Mercado de capitais</option><option>Valuation</option></select></div><div id="cards" class="grid"></div></section><section id="detail" class="hidden"><button class="back" onclick="location.hash=''">← Voltar ao dashboard</button><article id="content"></article></section></main><footer>Radar Corporate Banking • Edições de estudo • Conteúdo informativo, não constitui recomendação de crédito ou investimento.</footer><script>
const editions=[
{n:14,date:'12 out 2026',cat:'Governança',title:'Governança, sucessão e alocação de capital',summary:'Como a estrutura de controle, a sucessão e a política de dividendos afetam o risco futuro de crédito.',sections:[['Tese central','O balanço mostra o resultado das decisões passadas. A governança ajuda a compreender como serão tomadas as decisões futuras. Empresas com indicadores semelhantes podem ter perfis de risco diferentes em razão dos incentivos dos controladores.'],['Leituras principais','IBGC — Os Desafios da Alocação de Capital em Empresas Familiares (prioridade 10/10); FMI — Corporate Sector Stress Testing with Endogenous Balance Sheet Dynamics (10/10); IFC — Family Business Governance Handbook (10/10); BIS — Passive Investors and Loan Spreads (9,5/10); OCDE — Corporate Governance Factbook 2025 (9/10); Gersick et al. — Generation to Generation (9,5/10).'],['Aplicação prática','Mapeie acionistas, holdings, transações intragrupo, garantias cruzadas, conselho, política de dividendos e plano de sucessão. Avalie quem aprova CAPEX, endividamento, aquisições e distribuições.'],['Exercício','Escolha duas empresas familiares e compare FCO, FCF, alavancagem, dividendos, transações intragrupo e processos de decisão. Simule a saída do CEO, conflito societário e necessidade extraordinária de aporte.']],links:[['IBGC','https://www.ibgc.org.br/'],['IFC','https://www.ifc.org/'],['FMI','https://www.imf.org/']]},
{n:13,date:'out 2026',cat:'Crédito',title:'Zombie firms, evergreening e solvência',summary:'Como distinguir refinanciamento saudável de dependência estrutural de crédito e antecipar deterioração.',sections:[['Tese central','Liquidez, solvência e viabilidade econômica são conceitos distintos. Renovar uma dívida não resolve necessariamente um problema econômico.'],['Leituras principais','BIS — Zombie firms in emerging Asia (10/10); NBER — Industry Distress Anomaly (9,5/10); Howard Schilit — Financial Shenanigans (10/10); BCB — Relatório de Política Monetária de setembro de 2026 (10/10).'],['Aplicação prática','Compare cobertura de juros, serviço total da dívida, FCF acumulado, ROIC e histórico de rolagens. Analise pressão competitiva setorial e se novos empréstimos financiam investimento ou déficits recorrentes.'],['Exercício','Projete 24 meses sem novas captações. Identifique o primeiro mês em que o caixa fica abaixo do mínimo operacional e avalie alternativas reais de recuperação.']],links:[['BIS','https://www.bis.org/'],['NBER','https://www.nber.org/'],['BCB','https://www.bcb.gov.br/']]},
{n:12,date:'set 2026',cat:'Mercado de capitais',title:'O novo mapa do funding corporativo',summary:'Diversificação de fontes, debêntures, FIDCs, NBFIs e resiliência de financiamento.',sections:[['Tese central','A capacidade de acessar diferentes fontes de capital é uma dimensão de resiliência creditícia além da alavancagem.'],['Leituras principais','FMI — Bonding Through Crises with NBFIs (10/10); FMI — Banking on Nonbanks (9/10); ANBIMA — estatísticas de mercado de capitais (10/10); Frederic Mishkin — The Economics of Money, Banking, and Financial Markets (9/10).'],['Aplicação prática','Construa um Funding Map com saldos, limites, prazos, garantias, indexadores, custos e vencimentos. Diferencie financiamento de recebíveis, estoques, CAPEX e liquidez estrutural.'],['Exercício','Simule indisponibilidade por 12 meses do principal canal de funding. Quantifique a necessidade de caixa e as alternativas viáveis.']],links:[['ANBIMA','https://www.anbima.com.br/'],['FMI','https://www.imf.org/']]},
{n:11,date:'set 2026',cat:'Crédito',title:'Crédito para empresas asset-light',summary:'Receita recorrente, retenção de clientes, intangíveis e enterprise value como fundamentos de crédito.',sections:[['Tese central','Empresas com poucos ativos físicos podem possuir fluxos de caixa valiosos e previsíveis; a análise deve examinar sua sustentabilidade e conversão em caixa.'],['Leituras principais','BIS — Financing the digital economy: the role of private credit (10/10); Baruch Lev e Feng Gu — The End of Accounting (9,5/10); ANBIMA — dados de FIDCs (10/10).'],['Aplicação prática','Avalie ARR, churn, NRR, margem bruta, CAC, concentração de clientes, FCO e FCF. Diferencie valor em continuidade e valor de liquidação.'],['Exercício','Compare uma indústria intensiva em ativos com uma empresa asset-light e identifique a fonte primária de pagamento e a fonte de recuperação em cenário adverso.']],links:[['BIS','https://www.bis.org/'],['ANBIMA','https://www.anbima.com.br/']]},
{n:10,date:'set 2026',cat:'Valuation',title:'CPC 51, IFRS 18 e qualidade do EBITDA',summary:'Como reconciliar resultados ajustados, geração de caixa e métricas relevantes para covenants.',sections:[['Tese central','Resultado reportado, resultado ajustado e caixa econômico não são equivalentes. A IFRS 18 aumenta a transparência das medidas de desempenho definidas pela administração.'],['Leituras principais','IFRS Foundation — IFRS 18 (10/10); Stephen Penman — Financial Statement Analysis and Security Valuation (10/10); BCB — Pesquisa de Estabilidade Financeira (9,5/10).'],['Aplicação prática','Construa uma ponte entre EBITDA calculado e EBITDA ajustado. Classifique ajustes recorrentes e não recorrentes, e recalcule alavancagem e cobertura.'],['Exercício','Reconstrua três anos de EBITDA, FCO, FCF e DL/EBITDA sem utilizar inicialmente os números ajustados da empresa.']],links:[['IFRS Foundation','https://www.ifrs.org/'],['CPC','https://www.cpc.org.br/']]},
{n:9,date:'set 2026',cat:'IA',title:'IA e Relationship Banking',summary:'Como combinar informação quantitativa, relacionamento e inteligência artificial para melhorar decisões.',sections:[['Tese central','IA pode identificar anomalias e processar dados estruturados; o banker agrega contexto, informações qualitativas e julgamento.'],['Leituras principais','BIS — Artificial Intelligence and Relationship Lending (10/10); Miao Liu — Assessing Human Information Processing in Lending Decisions (10/10); Agrawal, Gans e Goldfarb — Power and Prediction (9,5/10); FEBRABAN — Pesquisa de Tecnologia Bancária (9,5/10).'],['Aplicação prática','Organize um fluxo: demonstrações → indicadores → anomalias → hipóteses → perguntas para o CFO → validação humana. Não carregue informações confidenciais em ferramentas sem autorização institucional.'],['Exercício','Escolha três anomalias financeiras de um cliente e converta-as em perguntas abertas para uma visita.']],links:[['BIS','https://www.bis.org/'],['FEBRABAN','https://portal.febraban.org.br/']]},
{n:8,date:'ago/set 2026',cat:'Valuation',title:'CAPEX de qualidade e alocação de capital',summary:'Como identificar investimentos que geram caixa e valor econômico, em vez de apenas aumentar o endividamento.',sections:[['Tese central','A análise de CAPEX deve ir além da expansão do EBITDA: crescimento cria valor apenas quando o retorno incremental justifica o capital comprometido.'],['Leituras principais','FMI — Brazil Article IV Consultation 2026 (10/10); NBER — Intangible Intensity (9,5/10); Benmelech, Kumar e Rajan — Debt and Assets (9,5/10); Koller et al. — Valuation (9,5/10).'],['Aplicação prática','Reconcilie CAPEX anunciado, executado e em operação com EBITDA, NOPAT, FCO, NCG e ROIC incrementais. Compare retorno e custo de capital.'],['Exercício','Projete CAPEX +15%, atraso de seis meses, receita -15%, margem EBITDA -2 p.p. e NCG +20%. Teste DSCR, covenants e liquidez.']],links:[['FMI','https://www.imf.org/'],['NBER','https://www.nber.org/']]},
